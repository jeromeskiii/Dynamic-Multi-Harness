[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-multi-harness"
version = "0.1.0"
description = "A host that owns authoritative session state and swaps replaceable harness runtimes behind a frozen ABI"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
dmh = "dmh.cli:main"

[tool.setuptools.packages.find]
include = ["dmh*"]

[tool.setuptools.package-data]
dmh = ["py.typed"]
